<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEUR-WS Entity Editor</title>
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --spacing: 0.75rem;
      /* Bridge Pico v2 --pico-* names to the unprefixed names used in our CSS */
      --card-background-color: var(--pico-card-background-color, #fff);
      --primary:               var(--pico-primary, #1b6ef3);
      --primary-background:    var(#e8f0fe);
      --muted-color:           var(--pico-muted-color, #646b7d);
      --muted-border-color:    var(--pico-muted-border-color, #d0d7e2);
      --border-radius:         var(--pico-border-radius, 0.375rem);
      --del-color:             #c62a2f;
    }
    nav { padding: var(--spacing) calc(var(--spacing) * 2); }
    .entity-editor { max-width: 900px; margin: 0 auto; padding: var(--spacing); }
    .field-row { margin-bottom: 1rem; }
    .field-row label { font-weight: 600; margin-bottom: 0.25rem; display: block; }
    .list-field-item { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .list-field-item input { flex: 1; margin: 0; }
    .suggestions { position: absolute; background: var(--card-background-color); border: 1px solid var(--muted-border-color); z-index: 100; width: 100%; max-height: 240px; overflow-y: auto; border-radius: var(--border-radius); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .suggestion-item { padding: 0.5rem 0.75rem; cursor: pointer; }
    .suggestion-item:hover, .suggestion-item.active { background: var(--primary-background); }
    .suggestion-label { font-weight: 500; }
    .suggestion-desc { font-size: 0.85em; color: var(--muted-color); }
    .suggestion-id { font-size: 0.8em; color: var(--muted-color); margin-left: 0.5rem; }
    .search-wrap { position: relative; }
    .stmt-table { width: 100%; font-size: 0.9em; }
    .stmt-table th, .stmt-table td { padding: 0.4rem 0.6rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--primary); color: #fff; font-size: 0.75em; }
    .diff-table td:first-child { width: 35%; font-weight: 500; }
    dialog article { max-width: 640px; }
    .success-banner { background: #d4edda; color: #155724; border-radius: var(--border-radius); padding: 0.75rem 1rem; margin-bottom: 1rem; }
    .error-banner  { background: #f8d7da; color: #721c24; border-radius: var(--border-radius); padding: 0.75rem 1rem; margin-bottom: 1rem; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid var(--muted-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .item-chip { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--primary-background); border: 1px solid var(--primary); border-radius: 999px; padding: 0.2rem 0.5rem 0.2rem 0.75rem; font-size: 0.9em; max-width: 100%; }
    .item-chip-label { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-chip-id { color: var(--muted-color); font-size: 0.85em; }
    .item-chip-edit { background: none; border: none; cursor: pointer; padding: 0 0.25rem; color: var(--primary); font-size: 1em; line-height: 1; margin: 0; box-shadow: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
